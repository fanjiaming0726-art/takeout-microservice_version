server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
      # ???
        - id: customer-route
          uri: http://localhost:8081
          predicates:
            - Path=/customer/**

        - id: seller-route
          uri: http://localhost:8081
          predicates:
            - Path=/seller/**

        - id: websocket-route
          uri: http://localhost:8081
          predicates:
            - Path=/ws/**

        - id: file-route
          uri: http://localhost:8081
          predicates:
            - Path=/file/**
management:
  endpoints:
    web:
      exposure:
        include: health,info